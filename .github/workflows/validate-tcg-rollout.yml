name: Validate TCG rollout
on:
  pull_request:
    paths: ['scripts/**', 'infra/jobs/tcg-medusa*.template', '.github/workflows/validate-tcg-rollout.yml']
  push:
    branches: [main]
    paths: ['scripts/**', 'infra/jobs/tcg-medusa*.template', '.github/workflows/validate-tcg-rollout.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rollout-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - name: Python deployment contracts
        run: python -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Go template contracts
        env:
          GO111MODULE: 'off'
        run: go test ./scripts/tests
      - name: Shell syntax
        run: |
          for script in scripts/gitops-deploy.sh scripts/quick-deploy-tcg-medusa.sh scripts/wait-for-nomad-batch.sh; do
            bash -n "$script"
          done
      - name: Install isolated Nomad parser (no server or production credentials)
        run: |
          docker run --rm --entrypoint cat hashicorp/nomad:1.9 /bin/nomad > "$RUNNER_TEMP/nomad"
          chmod +x "$RUNNER_TEMP/nomad"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Validate generated service and migration jobs
        env:
          NOMAD_ADDR: http://127.0.0.1:4646
        run: python scripts/tests/validate-tcg-managed-jobs.py
